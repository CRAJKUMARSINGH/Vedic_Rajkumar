version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - automated
    groups:
      react:
        patterns: ["react", "react-dom", "react-router-dom", "@types/react*"]
      radix:
        patterns: ["@radix-ui/*"]
      build:
        patterns: ["vite", "vitest", "eslint", "@typescript-eslint/*", "tailwindcss"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    labels:
      - dependencies
      - automated
