name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    name: Lint · Types · Tests · Build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22.22.1]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Quality gates
        # docs:verify runs the full Vitest suite (pretty + JSON reporters) and
        # fails if any test fails OR any tracked doc states a stale metric, so
        # it replaces a standalone `npm run test:run` here.
        run: |
          npm run lint
          npm run typecheck
          npm run typecheck:tests
          npm run docs:verify
          npm run build
        env:
          CI: true
