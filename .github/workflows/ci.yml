name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    name: Lint · Types · Tests · Build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22.22.1]

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # commitlint needs the commits on both sides of the range, so the
          # default depth-1 clone is not enough.
          fetch-depth: 0

      - name: Setup Node ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint commit messages (pull request range)
        if: github.event_name == 'pull_request'
        run: npx commitlint --from "${{ github.event.pull_request.base.sha }}" --to "${{ github.event.pull_request.head.sha }}" --verbose

      - name: Lint commit messages (pushed range)
        # Skipped when `before` is the zero SHA (first push of a branch), which
        # has no range to walk.
        if: github.event_name == 'push' && github.event.before != '0000000000000000000000000000000000000000'
        run: npx commitlint --from "${{ github.event.before }}" --to "${{ github.event.after }}" --verbose

      - name: Quality gates
        # docs:verify runs the full Vitest suite (pretty + JSON reporters) and
        # fails if any test fails OR any tracked doc states a stale metric, so
        # it replaces a standalone `npm run test:run` here.
        #
        # answers:check re-emits the Answer Layer with the pinned `as_of` and
        # fails on drift. docs:verify only covers `_all.md` via the parity test;
        # this gates the topic-level cards and index.json too.
        run: |
          npm run lint
          npm run typecheck
          npm run typecheck:tests
          npm run docs:verify
          npm run answers:check
          npm run build
        env:
          CI: true
