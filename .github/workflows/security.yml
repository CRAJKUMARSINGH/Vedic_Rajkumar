name: Security Audit

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  schedule:
    # Run weekly on Monday 03:00 UTC to catch new CVEs between PRs
    - cron: '0 3 * * 1'

permissions:
  contents: read

jobs:
  # ── 1. Dependency vulnerability scan ────────────────────────────────────────
  dependency-audit:
    name: npm audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node 22.22.1
        uses: actions/setup-node@v4
        with:
          node-version: '22.22.1'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit production dependencies
        # Production dependencies block the workflow on moderate-or-higher advisories.
        run: npm audit --omit=dev --audit-level=moderate

      - name: Audit all dependencies (informational)
        # Full audit includes development tooling; retain the report without blocking deploys.
        run: npm audit --audit-level=high
        continue-on-error: true

  # ── 2. Secrets / credential leak scan ───────────────────────────────────────
  secrets-scan:
    name: TruffleHog secrets scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history so TruffleHog can scan all commits

      - name: TruffleHog OSS
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ${{ github.event.repository.default_branch }}
          head: HEAD
          # Only report verified secrets (reduces false positives)
          extra_args: --only-verified

  # ── 3. Type safety check ─────────────────────────────────────────────────────
  typecheck:
    name: TypeScript strict check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node 22.22.1
        uses: actions/setup-node@v4
        with:
          node-version: '22.22.1'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: TypeScript check
        run: npm run typecheck
