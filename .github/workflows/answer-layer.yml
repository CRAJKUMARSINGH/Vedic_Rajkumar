name: answer-layer

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  # ── Drift gate: the served answer cards must match the engine ─────────────
  answers-drift:
    name: Answers drift gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify public/answers is not stale
        run: npm run answers:check -- --as-of=2026-10-24

  # ── Contract + parity tests ───────────────────────────────────────────────
  answers-tests:
    name: Answer card tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Run answer card tests
        run: npx vitest run src/tests/answerCard
