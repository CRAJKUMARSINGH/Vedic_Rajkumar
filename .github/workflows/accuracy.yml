name: accuracy

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '0 2 * * *'   # nightly at 02:00 UTC
  workflow_dispatch:

jobs:
  # ── Fast gate (every PR) ──────────────────────────────────────────────────
  corpus-gate:
    name: Corpus gate (15 charts)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run accuracy corpus gate
        run: npm run test:accuracy:corpus

      - name: Run timezone wiring guard
        run: npm run test:tz-wiring

      - name: Upload accuracy results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: accuracy-corpus
          path: tools/accuracy/golden/manifest.json

  # ── Fast accuracy tests (every PR) ──────────────────────────────────────
  accuracy-unit:
    name: Accuracy unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Run accuracy unit tests
        run: npm run test:accuracy:fast
      - name: Run time-scale gate (UT/TT split)
        run: npm run test:time

  # ── Full suite (nightly + main push) ─────────────────────────────────────
  full-suite:
    name: Full test suite
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Run all tests
        run: npm run test:run
      - name: Build
        run: npm run build
