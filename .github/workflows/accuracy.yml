name: accuracy

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '0 2 * * *'   # nightly at 02:00 UTC
  workflow_dispatch:

jobs:
  # ── Fast gate (every PR) ──────────────────────────────────────────────────
  corpus-gate:
    name: Corpus · Shadbala · hook budget
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run accuracy corpus gate
        run: npm run test:accuracy:corpus

      - name: Run Shadbala accuracy tests (independent oracle)
        # Week 15: analytic closed forms, Saptavarga/D4/D20/D60 mapping, the
        # 15-chart engine coherence sweep, and the birth-offset wiring effect.
        # The npm script pins --hookTimeout=2000 itself.
        run: npm run test:accuracy:shadbala

      - name: Timezone wiring + hook budget (DEF-010)
        # The suites that flaked (DEF-010) are hookless, so an explicit 2s hook
        # budget proves they fail on an assertion — never on wall-clock. A
        # silent revert to a wall-clock timeout would show up here.
        run: npx vitest run src/tests/chartTimezoneWiring.test.ts src/tests/answerCard/schema.test.ts --hookTimeout=2000

      - name: Upload accuracy results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: accuracy-corpus
          path: tools/accuracy/golden/manifest.json

  # ── Fast accuracy tests (every PR) ──────────────────────────────────────
  accuracy-unit:
    name: Accuracy unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Run accuracy unit tests
        run: npm run test:accuracy:fast
      - name: Run time-scale gate (UT/TT split)
        run: npm run test:time

  # ── Full suite (nightly + main push) ─────────────────────────────────────
  full-suite:
    name: Full test suite
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Run all tests
        run: npm run test:run
      - name: Build
        run: npm run build
