name: P12 native ephemeris verification

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-ephemeris:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          sparse-checkout: scripts/accuracy-second-engine.mjs
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Compare native Swiss Ephemeris and WASM on synthetic epochs
        run: |
          python -m pip install --only-binary=:all: --no-deps pysweph==2.10.3.6
          npm install --prefix "$RUNNER_TEMP/p12" --no-audit --no-fund --ignore-scripts swisseph-wasm@0.1.0
          cp scripts/accuracy-second-engine.mjs "$RUNNER_TEMP/p12/"
          node "$RUNNER_TEMP/p12/accuracy-second-engine.mjs"
