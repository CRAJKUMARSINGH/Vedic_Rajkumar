name: Deploy

on:
  push:
    branches: [main]

concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:run
      - run: npm run accuracy:publish && npm run build
        env:
          VITE_RELEASE_VERSION: ${{ github.sha }}
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist

  # Runs BEFORE anything reaches production. Six checks, each one a way a deploy
  # has silently broken prod (docs/ops/UPDATE_SAFETY.md §10). fetch-depth: 0 is
  # required — the migration and SW-cache checks diff HEAD~1.
  safety:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: node scripts/deploy-safety.mjs --production

  migrate:
    needs: [verify, safety]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
      - run: supabase link --project-ref ${{ secrets.SUPABASE_REF }}
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      - run: supabase db push
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}

  # Edge functions deploy from the path-filtered `deploy-edge.yml` workflow
  # (typecheck → deploy → smoke → rollback on failure). Keeping a second
  # `functions deploy` here would double-deploy and race the rollback path.

  deploy-frontend:
    needs: migrate
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - run: npx netlify deploy --prod --dir=dist
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}

      - name: Record the rollback artefact
        # Two readers, two shapes: deploy-safety.mjs wants { edgeVersion, commit },
        # deploy-rollback.mjs wants { current, previous }. Write the union so neither
        # silently reads `undefined`. The diff on this file is the deploy record.
        run: |
          mkdir -p .deploy
          node -e '
          const fs = require("fs");
          const f = ".deploy/rollback.json";
          const prev = fs.existsSync(f) ? JSON.parse(fs.readFileSync(f, "utf-8")) : {};
          const entry = { version: process.env.GITHUB_SHA, commit: process.env.GITHUB_SHA, at: new Date().toISOString(), alias: process.env.GITHUB_REF_NAME };
          fs.writeFileSync(f, JSON.stringify({
            ...prev,
            edgeVersion: entry.version,
            commit: entry.commit,
            current: { ...(prev.current || {}), frontend: entry },
            previous: { ...(prev.previous || {}), frontend: (prev.current || {}).frontend ?? null },
          }, null, 2));
          '
      - uses: actions/upload-artifact@v4
        with:
          name: rollback-pointer
          path: .deploy/rollback.json

  smoke:
    needs: deploy-frontend
    runs-on: ubuntu-latest
    steps:
      - run: |
          curl -sf "${{ secrets.API_URL }}/health" | grep -q healthy
          echo "smoke passed"
