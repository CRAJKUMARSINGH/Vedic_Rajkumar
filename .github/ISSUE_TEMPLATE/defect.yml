name: Defect
description: Something is wrong
labels: [defect]
body:
  - type: input
    id: def-id
    attributes: { label: 'DEF id', placeholder: 'DEF-014' }
    validations: { required: true }
  - type: dropdown
    id: severity
    attributes:
      label: Severity
      options: [S1-critical, S2-high, S3-medium, S4-low]
    validations: { required: true }
  - type: textarea
    id: repro
    attributes: { label: 'Reproduction', description: 'Steps, plus the observed vs expected' }
    validations: { required: true }
  - type: input
    id: grade
    attributes: { label: 'Grade affected', placeholder: 'free | pro | enterprise | all' }
  - type: textarea
    id: evidence
    attributes: { label: 'Evidence', description: 'reports/tiers/*.json, logs, query result' }
  - type: dropdown
    id: disposition
    attributes:
      label: Disposition
      options: [fix, RISK_ACCEPTED, defer]
    validations: { required: true }
  - type: textarea
    id: logbook
    attributes: { label: 'Logbook entry', description: 'append-only entry per app-robustness-testing.md' }
