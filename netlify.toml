[build]
  command = "npm run build"
  publish = "dist"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[build.environment]
  NODE_VERSION = "20"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/service-worker.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# ── Security headers (all routes) ─────────────────────────────────────────────
# Target: A+ on https://securityheaders.com
[[headers]]
  for = "/*"
  [headers.values]
    # Prevent MIME sniffing
    X-Content-Type-Options = "nosniff"

    # Block clickjacking — app never runs in a frame
    X-Frame-Options = "DENY"

    # Only send origin on same-origin requests; strip referrer on cross-origin
    Referrer-Policy = "strict-origin-when-cross-origin"

    # Disable unused browser features
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()"

    # HSTS — 2-year max-age; preload-ready
    Strict-Transport-Security = "max-age=63072000; includeSubDomains; preload"

    # Content Security Policy
    # - default-src 'self'         → everything must come from our origin by default
    # - script-src adds 'unsafe-eval' for WASM (swisseph-wasm) + Clerk CDN
    # - style-src adds 'unsafe-inline' for Tailwind CSS-in-JS + shadcn
    # - connect-src allows Supabase, Clerk, PostHog, Sentry
    # - frame-src allows Clerk hosted auth pages
    # - worker-src 'self' blob: for service worker + Web Workers
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-eval' https://*.clerk.accounts.dev https://js.clerk.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self' https://*.supabase.co wss://*.supabase.co https://*.clerk.com https://*.clerk.accounts.dev https://app.posthog.com https://*.sentry.io; frame-src 'self' https://*.clerk.accounts.dev https://*.clerk.com; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; upgrade-insecure-requests"

    # Block cross-origin embedding of sensitive resources
    X-Permitted-Cross-Domain-Policies = "none"

    # Prevent IE/Edge from opening downloads in the page context
    X-Download-Options = "noopen"
