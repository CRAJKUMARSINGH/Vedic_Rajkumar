[build]
  # Regenerate the public accuracy snapshot from the corpus + golden data, then
  # build. The snapshot is imported at build time (src/generated/summary.json),
  # so it must be rewritten before Vite bundles it.
  command = "npm run accuracy:publish && npm run answers:emit && npm run build"
  publish = "dist"

[build.environment]
  # ── Neon extension block ──────────────────────────────────────────────────
  # The Neon DB extension was accidentally attached to this site at the
  # Netlify team level. This project uses Supabase exclusively.
  # Setting this env var prevents ALL dashboard-injected extensions from
  # running their build hooks, stopping the indefinite hang on
  # "Installing extensions → neon" during every deploy.
  # Permanent removal: app.netlify.com → team settings → Extensions → Neon → Remove
  NETLIFY_SKIP_EXTENSIONS = "true"
  NODE_VERSION = "22.22.1"

# NOTE: /answers/** is served as static files (no redirect needed).
# Always link answer cards WITH a file extension — the /* SPA rewrite
# below will swallow extensionless paths.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/service-worker.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# ── Security headers (all routes) ─────────────────────────────────────────────
# Target: A+ on https://securityheaders.com
[[headers]]
  for = "/*"
  [headers.values]
    # Prevent MIME sniffing
    X-Content-Type-Options = "nosniff"

    # Block clickjacking — app never runs in a frame
    X-Frame-Options = "DENY"

    # Only send origin on same-origin requests; strip referrer on cross-origin
    Referrer-Policy = "strict-origin-when-cross-origin"

    # Disable unused browser features
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()"

    # HSTS — 2-year max-age; preload-ready
    Strict-Transport-Security = "max-age=63072000; includeSubDomains; preload"

    # Content Security Policy
    # - default-src 'self'         → everything must come from our origin by default
    # - script-src adds 'unsafe-eval' for WASM (swisseph-wasm) + Clerk CDN
    # - style-src adds 'unsafe-inline' for Tailwind CSS-in-JS + shadcn
    # - connect-src allows Supabase, Clerk, PostHog, Sentry
    # - frame-src allows Clerk hosted auth pages
    # - worker-src 'self' blob: for service worker + Web Workers
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-eval' https://*.clerk.accounts.dev https://js.clerk.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self' https://*.supabase.co wss://*.supabase.co https://*.clerk.com https://*.clerk.accounts.dev https://app.posthog.com https://*.sentry.io; frame-src 'self' https://*.clerk.accounts.dev https://*.clerk.com; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests"

    # Block cross-origin embedding of sensitive resources
    X-Permitted-Cross-Domain-Policies = "none"

    # Prevent IE/Edge from opening downloads in the page context
    X-Download-Options = "noopen"

    # Cross-origin isolation — keep our documents and resources same-origin.
    # COOP uses "same-origin-allow-popups" so Clerk's OAuth popups retain
    # window.opener. COEP is deliberately NOT set: the app uses no
    # SharedArrayBuffer / crossOriginIsolated features, and "require-corp"
    # would break the cross-origin Clerk/PostHog/Sentry scripts.
    Cross-Origin-Opener-Policy = "same-origin-allow-popups"
    Cross-Origin-Resource-Policy = "same-origin"
